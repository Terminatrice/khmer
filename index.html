<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ចេះ · Khmer</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif+Khmer:wght@400;500;600&display=swap">

<style>
:root{
  --ground:#F4F5F2;--surface:#FFFFFF;--sunk:#EBEDE8;
  --line:#D6DAD3;--line-soft:#E4E7E1;
  --ink:#1B211D;--ink-soft:#545C55;--ink-faint:#7C857D;
  --accent:#0E6B62;--accent-bright:#13897D;--accent-wash:#E2EFEC;
  --gold:#9A6F1E;--gold-wash:#F3EBD9;
  --warn:#8C3A2B;--warn-wash:#F6E7E3;
  --ok:#2E6B3E;--ok-wash:#E4EFE6;
  --fd:"Newsreader",Georgia,serif;
  --fu:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --fk:"Noto Serif Khmer","Khmer OS",serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121614;--surface:#1A1F1C;--sunk:#232925;
  --line:#333B36;--line-soft:#2A312C;
  --ink:#E8EBE7;--ink-soft:#A8B1A9;--ink-faint:#7B857D;
  --accent:#55BFB1;--accent-bright:#6FD5C6;--accent-wash:#1B2E2B;
  --gold:#D6AC5E;--gold-wash:#2C2617;
  --warn:#E09080;--warn-wash:#2E1C18;
  --ok:#7FC08E;--ok-wash:#1B2A1F;
}}
:root[data-theme="dark"]{
  --ground:#121614;--surface:#1A1F1C;--sunk:#232925;
  --line:#333B36;--line-soft:#2A312C;
  --ink:#E8EBE7;--ink-soft:#A8B1A9;--ink-faint:#7B857D;
  --accent:#55BFB1;--accent-bright:#6FD5C6;--accent-wash:#1B2E2B;
  --gold:#D6AC5E;--gold-wash:#2C2617;
  --warn:#E09080;--warn-wash:#2E1C18;
  --ok:#7FC08E;--ok-wash:#1B2A1F;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);font-family:var(--fu);
  font-size:1.15rem;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:660px;margin:0 auto;padding:0 1.1rem 6rem}

/* header */
header{padding:1.6rem 0 .9rem;display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
header h1{
  font-family:var(--fk);font-weight:600;font-size:2rem;margin:0;
  color:var(--accent);line-height:1.6;
}
header .sub{font-size:.95rem;color:var(--ink-faint);margin-left:auto;font-family:var(--fm)}

/* tabs */
nav{display:flex;gap:.35rem;border-bottom:1px solid var(--line);margin-bottom:1.4rem;overflow-x:auto}
nav button{
  font-family:var(--fu);font-size:1.02rem;font-weight:600;
  background:none;border:none;border-bottom:2.5px solid transparent;
  color:var(--ink-faint);padding:.6rem .8rem;cursor:pointer;white-space:nowrap;
}
nav button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent-bright);outline-offset:-2px}

/* generic */
h2{font-family:var(--fd);font-weight:500;font-size:1.7rem;margin:2rem 0 .6rem;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h3{font-size:1.08rem;font-weight:600;margin:1.4rem 0 .4rem;color:var(--accent)}
p{margin:.6rem 0}
.muted{color:var(--ink-soft);font-size:1.05rem}
.kh{font-family:var(--fk);line-height:1.75}
.rom{font-family:var(--fm);font-size:.95em;color:var(--accent);font-style:normal}
.ipa{font-family:var(--fm);font-size:.92em;color:var(--ink-faint);white-space:nowrap}
.audio{font-size:.92rem;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;white-space:nowrap}
.audio:hover{color:var(--accent-bright)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:1.2rem 1.3rem;margin:1rem 0;
}
.pill{
  display:inline-block;font-family:var(--fm);font-size:.72rem;
  padding:.14rem .45rem;border-radius:3px;vertical-align:middle;
  background:var(--sunk);color:var(--ink-faint);
}
.pill.ok{background:var(--ok-wash);color:var(--ok)}
.pill.val{background:var(--gold-wash);color:var(--gold)}
.pill.no{background:var(--warn-wash);color:var(--warn)}

button.act{
  font-family:var(--fu);font-size:1.05rem;font-weight:600;
  padding:.7rem 1.2rem;border-radius:5px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;
}
button.act:hover{border-color:var(--accent);color:var(--accent)}
button.act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.act.pri:hover{background:var(--accent-bright);border-color:var(--accent-bright);color:#fff}
button.act:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}

/* session card */
.q{text-align:center;padding:2.2rem 1.3rem}
.q .prompt-kh{font-family:var(--fk);font-size:3.1rem;line-height:1.6;font-weight:500;word-break:break-word}
.q .prompt-fr{font-family:var(--fd);font-size:2rem;line-height:1.25;font-weight:500}
.q .rom{display:block;font-size:1.15rem;margin-top:.3rem}
.q .answer{margin-top:1.4rem;padding-top:1.3rem;border-top:1px dashed var(--line)}
.q .answer .fr{font-size:1.35rem}
.q .note{font-size:1rem;color:var(--ink-soft);margin-top:.8rem;text-align:left}

/* qcm */
.opts{display:flex;flex-direction:column;gap:.55rem;margin-top:1.2rem}
.opts button{
  font-family:var(--fu);font-size:1.08rem;text-align:left;
  padding:.75rem .95rem;border-radius:5px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);cursor:pointer;
}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button:disabled{cursor:default;opacity:.75}
.opts button.good{border-color:var(--ok);background:var(--ok-wash);opacity:1}
.opts button.bad{border-color:var(--warn);background:var(--warn-wash);opacity:1}
.gabarit{
  font-family:var(--fm);font-size:1rem;background:var(--sunk);
  border:1px solid var(--line-soft);border-radius:5px;
  padding:.8rem .9rem;margin:.9rem 0;overflow-x:auto;white-space:nowrap;text-align:center;
}
.gabarit b{color:var(--accent)}

/* progress */
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:.5rem 0}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.stats{display:flex;gap:1.4rem;flex-wrap:wrap;margin:.5rem 0 1rem}
.stats div{display:flex;align-items:baseline;gap:.35rem}
.stats b{font-family:var(--fd);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.stats span{font-size:.92rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}

/* bloc list */
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:.9rem 0;overflow:hidden}
.bloc-h{display:flex;align-items:baseline;gap:.8rem;padding:.9rem 1.1rem;background:var(--sunk);flex-wrap:wrap}
.bloc-h .n{font-family:var(--fm);font-size:.85rem;color:var(--accent)}
.bloc-h h3{margin:0;flex:1 1 auto;color:var(--ink);font-size:1.12rem}
.bloc-b{padding:1rem 1.1rem}
.regle{font-family:var(--fd);font-size:1.2rem;line-height:1.4}

/* dico */
.entry{display:flex;gap:.9rem;align-items:baseline;padding:.6rem 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.entry .kh{font-size:1.6rem;min-width:5.5rem}
.entry .fr{color:var(--ink-soft);flex:1 1 8rem}
input[type=search]{
  width:100%;font-family:var(--fu);font-size:1.08rem;padding:.6rem .8rem;
  border:1.5px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);
}
input[type=search]:focus-visible{outline:2px solid var(--accent-bright);outline-offset:1px}

.call{border-left:3px solid var(--gold);background:var(--gold-wash);padding:.9rem 1.1rem;margin:1rem 0;font-size:1.04rem;color:var(--ink-soft)}
.call.warn{border-left-color:var(--warn);background:var(--warn-wash)}
.call strong{color:var(--ink)}

footer{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line-soft);font-size:.95rem;color:var(--ink-faint)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>ចេះ</h1>
  <div class="sub"><span id="build-stamp">159 mots · 8 blocs · 144 vérifiés · 2026-08-24</span></div>
</header>

<nav role="tablist">
  <button role="tab" id="t-rev"  aria-selected="true"  onclick="go('rev')">Réviser</button>
  <button role="tab" id="t-bloc" aria-selected="false" onclick="go('bloc')">Blocs</button>
  <button role="tab" id="t-ecr" aria-selected="false" onclick="go('ecr')">Écriture</button>
  <button role="tab" id="t-sons" aria-selected="false" onclick="go('sons')">Sons</button>
  <button role="tab" id="t-dico" aria-selected="false" onclick="go('dico')">Dico</button>
  <button role="tab" id="t-val"  aria-selected="false" onclick="go('val')">À valider</button>
</nav>

<main>
  <section id="p-rev"></section>
  <section id="p-bloc" class="hidden"></section>
  <section id="p-ecr" class="hidden"></section>
  <section id="p-sons" class="hidden"></section>
  <section id="p-dico" class="hidden"></section>
  <section id="p-val"  class="hidden"></section>
</main>

<footer>
  Progression enregistrée dans ce navigateur. Les mots marqués
  <span class="pill val">à valider</span> attendent la confirmation d'un locuteur natif.
</footer>

</div>

e","source":"https://en.wiktionary.org/wiki/បង្គន់","note":"Graphie du brouillon (បង់គន់) inexistante sur Wiktionary ; la forme attestée est បង្គន់.","ipa":"ɓɑŋ.ˈkŭən"},{"id":361,"kh":"ឡានក្រុង","rom":"laan krong","fr":"bus","niveau":1,"section":"Lieux et déplacements","statut":"verifie","source":"https://en.wiktionary.org/wiki/ឡានក្រុង","note":"Composé de ឡាន (véhicule) et ក្រុង (ville).","ipa":"laːn ˈkroŋ"},{"id":363,"kh":"យន្តហោះ","rom":"yŭən hɑh","fr":"avion","niveau":1,"section":"Lieux et déplacements","statut":"verifie","source":"https://en.wiktionary.org/wiki/យន្តហោះ","note":"Synonyme donné : កប៉ាល់ហោះ (kaʼpal hɑh).","ipa":"jŭən ˈhɑh"},{"id":370,"kh":"ថ្លៃដើម","rom":"","fr":"prix de revient, coût de base","niveau":3,"section":"Lieux et déplacements","statut":"a_valider","source":"https://en.wiktionary.org/wiki/ដើម","note":"Composé de deux éléments. ថ្លៃ (thlay, « prix, coût ») et ដើម (daəm, « origine, base, capital ») sont confirmés séparément sur Wiktionary. Le composé lui-même n'a pas d'entrée dédiée dans les sources consultées, mais apparaît en usage économique (« prix de revient », « coût unitaire ») sur des pages non lexicographiques.","ipa":""},{"id":374,"kh":"មេឃ","rom":"meik","fr":"ciel, nuage, temps (météo)","niveau":2,"section":"Nature et animaux","statut":"verifie","source":"https://en.wiktionary.org/wiki/មេឃ","note":"","ipa":"meik"},{"id":379,"kh":"សមុទ្រ","rom":"saʼmot","fr":"mer, océan","niveau":2,"section":"Nature et animaux","statut":"verifie","source":"https://en.wiktionary.org/wiki/សមុទ្រ","note":"","ipa":"saʔ.ˈmot"},{"id":381,"kh":"ស្រែ","rom":"srae","fr":"rizière, champ","niveau":1,"section":"Nature et animaux","statut":"verifie","source":"https://en.wiktionary.org/wiki/ស្រែ","note":"","ipa":"srae"},{"id":393,"kh":"ឬ","rom":"rɨɨ","fr":"ou","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ឬ","note":"A aussi un emploi de particule interrogative finale de phrase (« n'est-ce pas ? »).","ipa":"rɨː"},{"id":394,"kh":"ព្រោះ","rom":"prŭəh","fr":"parce que","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ព្រោះ","note":"Sens verbal premier : « semer des graines ». Synonyme conjonctif : ពីព្រោះ (pii prŭəh).","ipa":"prŭəh"},{"id":395,"kh":"ដូច្នេះ","rom":"doucneh","fr":"donc, ainsi","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដូច្នេះ","note":"Aussi adjectif (« être comme ceci, être de ce genre »). Comme adverbe : « so, thus, like this, this way » et « so, therefore » (connecteur de conséquence).","ipa":"ɗou.ˈcʰneh"},{"id":396,"kh":"បើ","rom":"baə","fr":"si","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/បើ","note":"Conjonction. Sens secondaire attesté : « although » (quoique).","ipa":"ɓaə"},{"id":397,"kh":"តែ","rom":"tae","fr":"mais ; seulement","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/តែ","note":"Homographe d'un nom signifiant « thé ». Conjonction : « but, however, if (ever) ». Adverbe : « only, just » ; sert aussi de particule dérivant des adverbes/adjectifs/conjonctions/préverbes composés.","ipa":"tae"},{"id":399,"kh":"ក៏","rom":"kɑɑ","fr":"aussi, alors (reprise)","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ក៏","note":"Conjonction. Deux sens documentés : « also, too » (constructions « à la fois... et... ») et « then, therefore, so, accordingly ».","ipa":"kɑː"},{"id":401,"kh":"ផង","rom":"phɑɑng","fr":"aussi, en plus","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ផង","note":"Conjonction/adverbe/particule. Comme particule : marque une requête polie (« please, would you ») et indique qu'une limite énoncée est moindre qu'elle aurait pu être.","ipa":"pʰɑːŋ"},{"id":405,"kh":"ដល់","rom":"dɑl","fr":"jusqu'à, arriver à","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដល់","note":"Verbe « to arrive, reach, attain » et préposition « to, up to, until ».","ipa":"ɗɑl"},{"id":408,"kh":"ក្រោម","rom":"kraom","fr":"sous","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ក្រោម","note":"Préposition simple : « under, below, beneath ».","ipa":"kraom"},{"id":410,"kh":"ក្រៅ","rom":"kraw","fr":"dehors, à l'extérieur","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ក្រៅ","note":"Wiktionary le classe adjectif : « outside; outer; foreign ».","ipa":"kraw"},{"id":412,"kh":"ខាង","rom":"khaang","fr":"côté, direction","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ខាង","note":"Nom « side, direction, part » ; aussi préposition (« in the field of, concerning ») et conjonction (« so long as, provided that »).","ipa":"kʰaːŋ"},{"id":413,"kh":"ចន្លោះ","rom":"cɑnlɑh","fr":"entre","niveau":3,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ចន្លោះ","note":"Nom « interval, gap, area in between » et préposition « between ».","ipa":"cɑn.ˈlɑh"},{"id":414,"kh":"ជុំវិញ","rom":"cum vɨñ","fr":"autour de","niveau":3,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ជុំវិញ","note":"Adverbe (« around, surrounding ») et préposition (« around » ; aussi « about, concerning »).","ipa":"cum ˈʋɨɲ"},{"id":416,"kh":"នឹង","rom":"nɨng","fr":"va… (futur)","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/នឹង","note":"Particule de futur (« will, about to »). Aussi préposition (« to, by means of, with ») et adjectif (« stable, immobile »). Wiktionary signale une confusion graphique fréquente avec និង (« et »).","ipa":"nɨŋ"},{"id":418,"kh":"ធ្លាប់","rom":"thlŏəp","fr":"avoir déjà fait (expérience)","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ធ្លាប់","note":"Verbe servant de marqueur d'aspect expérientiel : « to be accustomed to, to have experience with ».","ipa":"tʰlŏəp"},{"id":422,"kh":"ដែល","rom":"dael","fr":"qui, que (relatif)","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដែល","note":"Pronom relatif multi-usage (« who, which, where, when, the fact that »). Wiktionary liste aussi un verbe (« être constant »), un nom (« reste, occasion ») et un adverbe (« déjà, toujours »).","ipa":"ɗael"},{"id":423,"kh":"ថា","rom":"thaa","fr":"que (complétive)","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ថា","note":"Conjonction complétive introduisant le discours direct/indirect. Aussi verbe « to say, tell, pronounce » / « to criticize ».","ipa":"tʰaː"},{"id":425,"kh":"យ៉ាង","rom":"yaang","fr":"de manière, façon","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/យ៉ាង","note":"Nom « kind, type, manner » (forme des locutions adverbiales), aussi préposition « like, as, such as » et classificateur pour les types/sortes.","ipa":"jaːŋ"},{"id":426,"kh":"ទាំង","rom":"tĕəng","fr":"tous les, à la fois","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ទាំង","note":"Multi-catégoriel : adverbe (« also, entirely »), conjonction (« while, even though »), particule (« all, both », forme des adverbes comme ដោយ) et préposition (« including, together with »).","ipa":"tĕəŋ"},{"id":427,"kh":"ចំពោះ","rom":"cɑmpŭəh","fr":"quant à, envers","niveau":3,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ចំពោះ","note":"Préposition « toward, about, concerning, as for, vis-à-vis » ; aussi adjectif « dévoué, loyal envers ».","ipa":"cɑm.ˈpŭəh"},{"id":428,"kh":"អំពី","rom":"ʼɑmpii","fr":"à propos de","niveau":2,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/អំពី","note":"Préposition. Deux sens : « about, concerning » et « from, out of ».","ipa":"ʔɑm.ˈpiː"},{"id":429,"kh":"តាម","rom":"taam","fr":"selon, le long de, suivre","niveau":1,"section":"Mots grammaticaux et connecteurs","statut":"verifie","source":"https://en.wiktionary.org/wiki/តាម","note":"Verbe « to follow, pursue, imitate, agree » et préposition « according to, by way of, along, through ».","ipa":"taːm"},{"id":430,"kh":"ថ្វីបើ","rom":"","fr":"bien que","niveau":3,"section":"Mots grammaticaux et connecteurs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/ថ្វី","note":"Aucune entrée Wiktionary, SEAlang (certificat expiré, page inaccessible) ou kheng.info trouvée pour le composé ថ្វីបើ. Composants vérifiés séparément : ថ្វី = adverbe « why » (pourquoi), IPA /tʰʋəj/ (aussi un nom homographe « skill ») ; បើ = conjonction « if », sens secondaire « although » (voir id 396). Le composé lui-même reste NON_VERIFIE.","ipa":""},{"id":1001,"kh":"ចេញ","rom":"cəñ","fr":"sortir, vers l'extérieur","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ចេញ","note":"Verbe « to leave, go out, depart, exit » et adverbe fonctionnant comme postverbe directionnel de série verbale : « out, off, away ».","ipa":"cəɲ"},{"id":1002,"kh":"ឡើង","rom":"laəng","fr":"monter, vers le haut","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ឡើង","note":"Verbe directionnel « to go up, ascend, rise, climb, get on/board » et adverbe postverbal « up, upwards, increasingly » ; aussi préposition « on ».","ipa":"laəŋ"},{"id":1003,"kh":"ចុះ","rom":"coh","fr":"descendre, vers le bas","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ចុះ","note":"Verbe « to descend, go down, fall » et adverbe postverbal directionnel « down ». Le sens colloquial « et toi alors ? » indiqué dans l'entrée d'origine n'a pas été retrouvé sur Wiktionary (qui ne documente que verbe/adverbe) ; retiré de `sens` faute de source, à re-vérifier auprès d'un locuteur natif ou via SEAlang/kheng.info (inaccessibles lors de cette vérification).","ipa":"coh"},{"id":1004,"kh":"នឹង","rom":"nɨng","fr":"futur","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/នឹង","note":"Particule marqueur de futur (« will, about to »). Même entrée que l'id 416 ; voir sa note sur la confusion graphique avec និង.","ipa":"nɨŋ"},{"id":1005,"kh":"ធ្លាប់","rom":"thlŏəp","fr":"expérientiel, avoir déjà","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ធ្លាប់","note":"Verbe auxiliaire d'aspect expérientiel : « to be accustomed to doing, to have experience with ». Même entrée que l'id 418.","ipa":"tʰlŏəp"},{"id":1006,"kh":"មិនទាន់","rom":"mɨn tŏən","fr":"pas encore","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/មិនទាន់","note":"Adverbe composé de មិន (« ne pas ») + ទាន់ (tŏən) ; marqueur aspectuel « not yet », peut aussi indiquer un délai manqué ou un événement prématuré.","ipa":"mɨn ˈtŏən"},{"id":1007,"kh":"ទើប","rom":"təəp","fr":"alors, alors seulement, c'est alors que ; donc, par conséquent (marqueur d'antériorité immédiate / conséquence)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ទើប","note":"Conjonction. Sens Wiktionary : 'then, and then, next' ; 'then and only then, only then' ; 'so, consequently'. Marque qu'une action ne se produit qu'à partir d'un certain point (temporel ou logique), proche de 'ce n'est qu'alors que'.","ipa":"təːp"},{"id":1008,"kh":"បាន","rom":"baan","fr":"obtenir / pouvoir, réussir à / marqueur de passé accompli ('avoir fait') ; aussi adjectif 'bien, correct' et adverbe 'bien'","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/បាន","note":"Verbe / auxiliaire. Sens Wiktionary : verbe 'to get, obtain', 'to be able to, can', marqueur de passé ('have already done something'), marqueur d'achèvement ('to intend to complete something'), causatif ('to get someone to do something'), aussi adjectif 'OK, good, fine' et adverbe 'well'. Confirme le triple emploi mentionné dans le plan (accompli / obtenir / réussir à).","ipa":"ɓaːn"},{"id":1009,"kh":"កំពុងតែ","rom":"kɑmpung tae","fr":"être en train de (progressif renforcé)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/កំពុងតែ","note":"Entrée propre, composé de កំពុង (kɑmpung, particule d'aspect progressif : 'to be in the process of doing something') + តែ (tae). Classé verbe par Wiktionary, sens 'to be in the process of (doing something)'.","ipa":"kɑm.ˈpuŋ tae"},{"id":1010,"kh":"គួរ","rom":"kuə","fr":"devrait, devoir (moral/logique) ; aussi adjectif 'acceptable, convenable, digne de'","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/គួរ","note":"Fonctionne comme adjectif ('to be acceptable, suitable, correct, proper', 'to be worthy of, to deserve') et comme verbe modal ('should, ought to'). Exemple donné : យើងគួរខ្លាចអំពើអាក្រក់ 'nous devrions craindre le mal'.","ipa":"kuə"},{"id":1011,"kh":"តែងតែ","rom":"taeng tae","fr":"toujours, habituellement, constamment, régulièrement","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/តែងតែ","note":"Adverbe. Composé de តែង (taeng) + តែ (tae). Sens Wiktionary : 'usually, regularly, constantly, always, continually'.","ipa":"taeŋ ˈtae"},{"id":1012,"kh":"នៅតែ","rom":"nɨw tae","fr":"toujours, encore (persistance d'un état), rester tel quel","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/នៅតែ","note":"Adverbe marquant la persistance/continuation d'un état : 'to be left, remain; to leave, abandon; still; as before; invariably, constantly'. Le sens du brouillon ('toujours en train de') suggère à tort une lecture progressive (confusion possible avec កំពុងតែ) ; le sens attesté est plutôt 'encore, toujours (état inchangé)', proche de 'still' en anglais, pas un marqueur d'aspect progressif.","ipa":"nɨw ˈtae"},{"id":1013,"kh":"គ្រាន់តែ","rom":"krŏən tae","fr":"juste, seulement, simplement","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/គ្រាន់តែ","note":"Adverbe, composé de គ្រាន់ (krŏən) + តែ (tae). Sens Wiktionary : 'only, just, merely'.","ipa":"krŏən ˈtae"},{"id":1014,"kh":"ទាល់តែ","rom":"tŏəl tae","fr":"seulement si, jusqu'à ce que, à moins que, il faut que","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ទាល់តែ","note":"Classé préposition par Wiktionary, composé de ទាល់ + តែ (tae). Deux sens : 'until, up to' (temporel) et 'unless, must, provided that' (conditionnel). Le sens du brouillon ('seulement si') correspond au second emploi.","ipa":"tŏəl ˈtae"},{"id":1015,"kh":"សឹង","rom":"səng","fr":"presque, à peu près, légèrement","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/សឹង","note":"Adverbe (sens 'almost (all), nearly, just a little, slightly'). Wiktionary documente aussi un nom homographe désignant un filet à lapins, sans rapport avec l'usage grammatical.","ipa":"səŋ"},{"id":1016,"kh":"សិន","rom":"sən","fr":"d'abord, pour l'instant, pour un moment (particule finale hortative polie)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/សិន","note":"Particule : 'for now, for the time being, for a moment, first', décrite comme particule finale hortative polie. Wiktionary documente aussi des homographes sans rapport (nom : unité de longueur de 20 pyiəm ; adverbe 'parfois' ; nom propre 'Sen').","ipa":"sən"},{"id":1017,"kh":"ណា","rom":"naa","fr":"quel, lequel, où (interrogatif) ; n'importe quel, quelque part (indéfini) ; usage de bord de phrase pour adoucir un impératif/une demande (proche de 'hein' français), non détaillé comme tel dans l'entrée consultée","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ណា","note":"Wiktionary classe ណា comme pronom/déterminant : interrogatif ('which?, where?' en contexte indéfini/négatif/emphatique), locatif indéfini ('somewhere, anywhere'), universel emphatique ('wherever, anywhere'), déterminant ('any, any kind of'). L'entrée ne confirme PAS explicitement un sens de particule finale de type 'tag question / hein' isolé de ces valeurs ; le gloss du brouillon ('tag, hein ?') est une extrapolation pédagogique plausible (usage adoucissant en fin de phrase impérative, ex. ទៅណា/មកណា) mais non attestée telle quelle dans la source consultée. Ne pas présenter comme définition dictionnairique figée.","ipa":"naː"},{"id":1018,"kh":"ថា","rom":"thaa","fr":"que (conjonction de subordination introduisant le discours rapporté) ; dire, prononcer (verbe) ; aussi 'critiquer, blâmer'","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ថា","note":"Verbe ('to say, tell, pronounce' ; 'to criticize, blame') et conjonction ('that', introduisant discours direct ou indirect). Exemple : ខ្ញុំបាននិយាយថាខ្ញុំទៅ 'j'ai dit que j'irais'.","ipa":"tʰaː"},{"id":1019,"kh":"ដែល","rom":"dael","fr":"qui, que, lequel (pronom relatif, introduit une proposition relative) ; aussi adverbe 'déjà, une fois' (expérience antérieure)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដែល","note":"Pronom relatif ('who, which', introduit une relative, 'of/to/in/at which/whom', 'the fact that'). Wiktionary documente aussi un verbe ('to be constant/unchanged', 'to be handed down'), un nom ('leftover') et un adverbe ('ever, already, always', expérience passée).","ipa":"ɗael"},{"id":1020,"kh":"ព្រោះ","rom":"prŭəh","fr":"parce que","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ព្រោះ","note":"Conjonction de subordination causale ('because'). Wiktionary documente aussi un verbe homographe 'semer des graines' (étymologie commune, proto-môn-khmer *ruh/*ruəh 'tomber, se disperser'), sans rapport avec l'usage grammatical courant.","ipa":"prŭəh"},{"id":1021,"kh":"បើ","rom":"baə","fr":"si (conditionnel) ; aussi 'bien que' selon contexte","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/បើ","note":"Conjonction : 'if' ou 'although' selon le contexte.","ipa":"ɓaə"},{"id":1022,"kh":"ដូច្នេះ","rom":"doucneh","fr":"donc, ainsi, de cette façon (aussi adjectif 'être comme ça, de ce genre')","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដូច្នេះ","note":"Classé adjectif ('to be like this, to be this kind of') et adverbe ('so, thus, like this, this way' ou 'so, therefore'). Composé de ដូច (douc, 'comme') + នេះ (nih, 'ce/ceci'). Exemple : និយាយដូច្នេះមិនសមទេ 'ce n'est pas approprié de parler ainsi'.","ipa":"ɗou.ˈcʰneh"},{"id":1023,"kh":"ដើម្បី","rom":"daəmbəy","fr":"pour, afin de (but) ; pour, au profit de (préposition)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ដើម្បី","note":"Classé conjonction ('in order to, so that') et préposition ('for, for the sake of, to, toward').","ipa":"ɗaəm.ˈɓəj"},{"id":1024,"kh":"ពេល","rom":"peel","fr":"temps, moment, instant, période (nom) ; introduit une proposition temporelle 'quand, au moment où'","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ពេល","note":"Wiktionary classe ពេល uniquement comme NOM : 'time; moment, instant, period of time' (et, sans rapport, une plante ornementale, Mirabilis jalapa). L'entrée consultée ne documente pas d'emploi en conjonction 'quand' à part entière : cet usage se construit typiquement via ពេលដែល ou en tête de proposition temporelle avec ពេល nominal ('au moment où...'), pas comme conjonction lexicalisée indépendante.","ipa":"peːl"},{"id":1025,"kh":"ក្រោយពី","rom":"","fr":"après (que)","niveau":0,"section":"Mots-outils des blocs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/ក្រោយ ; https://en.wiktionary.org/wiki/ពី","note":"Locution non attestée comme entrée propre sur Wiktionary (404). Composants vérifiés séparément : ក្រោយ (kraoy) adjectif/adverbe/préposition 'after, behind, later, next' ; ពី (pii) préposition 'from, since, about'. La recherche web ne confirme pas ក្រោយពី comme forme standard attestée (un résultat suggère que la locution standard documentée est plutôt បន្ទាប់ពី 'après'). Sens plausible par composition ('après [le fait] de') mais non confirmé par une source lexicale.","ipa":""},{"id":1026,"kh":"មុននឹង","rom":"","fr":"avant (que)","niveau":0,"section":"Mots-outils des blocs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/មុន ; https://en.wiktionary.org/wiki/នឹង","note":"Locution non attestée comme entrée propre sur Wiktionary (404). Composants vérifiés séparément : មុន (mun) adverbe/préposition 'before, previously, formerly, ago' ; នឹង (nɨng) particule de futur 'will, about to' / préposition 'to, with, by means of'. Sens plausible par composition ('avant [de/que]') mais non confirmé comme locution figée par une source lexicale.","ipa":""},{"id":1027,"kh":"ទេ","rom":"tei","fr":"particule finale de question oui/non ; particule de négation (avec préverbe négatif មិន/អត់/ពុំ/ឥត)","niveau":0,"section":"Mots-outils des blocs","statut":"verifie","source":"https://en.wiktionary.org/wiki/ទេ","note":"Particule. Deux emplois attestés : particule finale interrogative dans les questions oui/non (ex. ថ្លៃទេ ? 'combien ça coûte / cher ?') ; particule finale de négation 'non, ne...pas', qui accompagne typiquement une particule préverbale négative (មិន mɨn, ពុំ pum, អត់ ʼɑt, ឥត ʼət).","ipa":"tei"},{"id":1028,"kh":"ឬទេ","rom":"","fr":"ou pas, ou non","niveau":0,"section":"Mots-outils des blocs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/ឬ ; https://en.wiktionary.org/wiki/ទេ","note":"Pas d'entrée propre trouvée pour la locution ឬទេ. Composants vérifiés séparément : ឬ (rȳ) conjonction 'or' (aussi particule interrogative finale 'n'est-ce pas ?') ; ទេ (tei) particule finale de question/négation (voir id 1027). Assemblage compositionnel plausible ('or [particule de question]' = 'ou pas'), non attesté comme unité lexicale propre.","ipa":""},{"id":1029,"kh":"ហើយឬនៅ","rom":"","fr":"déjà (fait) ou pas encore ?","niveau":0,"section":"Mots-outils des blocs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/ហើយ ; https://en.wiktionary.org/wiki/ឬ ; https://en.wiktionary.org/wiki/នៅ","note":"Pas d'entrée propre pour la locution complète, mais l'entrée de នៅ mentionne explicitement ហើយឬនៅ (haəy rɨɨ nɨv) comme exemple illustratif signifiant 'déjà ?' / 'pas encore ?', utilisé aussi en réponse pour dire 'pas encore'. Composants : ហើយ (haəy) marqueur d'accompli 'déjà' / conjonction 'et, puis' ; ឬ (rȳ) 'ou' ; នៅ (nɨw) verbe/adverbe 'rester, encore, toujours', qui en fin de question de ce type signifie 'pas encore'. Locution attestée en exemple d'usage mais pas comme entrée lexicale séparée : NON_VERIFIE au sens strict demandé, bien que fortement étayée.","ipa":""},{"id":1030,"kh":"មែនទេ","rom":"","fr":"n'est-ce pas (question de confirmation)","niveau":0,"section":"Mots-outils des blocs","statut":"a_valider","source":"https://en.wiktionary.org/wiki/មែន ; https://en.wiktionary.org/wiki/ទេ","note":"Pas d'entrée propre trouvée pour la locution មែនទេ. Composants vérifiés séparément : មែន (mɛɛn) adjectif/adverbe 'vrai, réel, exact, effectivement' (aussi interjection d'affirmation) ; ទេ (tei) particule finale de question/négation (voir id 1027). Assemblage compositionnel plausible ('vrai, non ?' = 'n'est-ce pas'), non attesté comme unité lexicale propre dans les sources consultées.","ipa":""}];
const EMBED_BLOCS = [{"id":"serialisation","ordre":1,"titre":"La sérialisation verbale","regle":"Le khmer enchaîne les verbes en série au lieu d'utiliser des auxiliaires.","gabarit":"VERBE + <b>DIRECTION</b> + (DÉICTIQUE)","mots":[1001,1002,1003],"exercices":[{"type":"choix","question":"Dans une chaîne de verbes en série, combien de marqueurs d'aspect faut-il ?","options":["Un seul, en tête, qui porte sur toute la chaîne","Un sur chaque verbe de la chaîne","Un seul, à la fin de la chaîne","Aucun, la sérialisation exclut l'aspect"],"reponse":0,"explication":"Un seul marqueur en tête porte sur toute la série. Le répéter est une erreur."},{"type":"choix","question":"Les directionnels ចេញ, ឡើង et ចុះ se placent où par rapport au verbe principal ?","options":["Après le verbe","Avant le verbe","En fin de phrase seulement","Au choix, les deux positions se valent"],"reponse":0,"explication":"Ce sont des directionnels postverbaux. Ils suivent le verbe qu'ils orientent."}]},{"id":"temps","ordre":2,"titre":"Le temps au complet","regle":"Le khmer n'a pas de conjugaison : le temps passe par des marqueurs d'aspect.","gabarit":"SUJET + (NÉG) + <b>MARQUEUR</b> + VERBE + (OBJET) + (MARQUEUR FINAL)","mots":[1004,1005,1006,1007,1008,1009,1010],"exercices":[{"type":"position","question":"Où se place ធ្លាប់, le marqueur d'expérience vécue ?","gabarit":"SUJET + ___ + VERBE + OBJET","options":["Avant le verbe, comme បាន et កំពុង","Après le verbe","En fin de phrase","Avant le sujet"],"reponse":0,"explication":"ធ្លាប់ est un auxiliaire préverbal. Il occupe le même emplacement que បាន et កំពុង."},{"type":"choix","question":"Quelle est la différence entre អាច seul et អាច … បាន ?","options":["អាច seul dit la capacité possible, អាច … បាន dit la capacité réalisée","Il n'y a aucune différence","អាច seul est familier, អាច … បាន est poli","អាច … បាន est la forme négative"],"reponse":0,"explication":"បាន en position postverbale est résultatif : il dit que la chose a effectivement abouti."},{"type":"choix","question":"Quel piège graphique guette នឹង, le marqueur de futur ?","options":["Il se confond avec និង « et », qui n'en diffère que par un signe vocalique","Il se confond avec នៅ « encore »","Il s'écrit de deux façons également correctes","Il ne s'écrit jamais, il est seulement oral"],"reponse":0,"explication":"នឹង (futur) et និង (et) sont couramment confondus à l'écrit, y compris par des locuteurs natifs. À l'oral ils se distinguent nettement."}]},{"id":"particules","ordre":3,"titre":"Les particules de nuance","regle":"Ces particules transforment des énoncés juxtaposés en discours modulé.","mots":[1011,1012,1013,1014,1015,1016,1017],"exercices":[{"type":"choix","question":"នៅតែ marque quoi exactement ?","options":["La persistance d'un état : ça continue, ça reste tel quel","Une action en cours de déroulement","Une action achevée","Une action à venir"],"reponse":0,"explication":"Correction issue de la vérification : នៅតែ est un marqueur de persistance, proche de « still », et non un progressif. Le progressif est កំពុងតែ."},{"type":"choix","question":"ទាល់តែ se couple habituellement avec quel autre marqueur ?","options":["ទើប","បាន","ហើយ","ណា"],"reponse":0,"explication":"ទាល់តែ … ទើប exprime la condition nécessaire : seulement si X, alors seulement Y."}]},{"id":"subordination","ordre":4,"titre":"La subordination","regle":"Le khmer préfère souvent la parataxe ; la subordination s'ajoute, elle ne remplace rien.","gabarit":"NOM + <b>ដែល</b> + PROPOSITION &nbsp;·&nbsp; VERBE DE DIRE + <b>ថា</b> + PROPOSITION","mots":[1018,1019,1020,1021,1022,1023,1024,1025,1026],"exercices":[{"type":"position","question":"Où se place la proposition relative introduite par ដែល ?","gabarit":"NOM + ___ ","options":["Après le nom, jamais avant","Avant le nom","Au choix selon le registre","En fin de phrase"],"reponse":0,"explication":"ដែល est strictement postnominal. Antéposer la relative est un calque du français."},{"type":"choix","question":"Dans une relative khmère, que fait-on du pronom repris ?","options":["Rien, il n'y en a pas : le khmer laisse une lacune","On le répète après le verbe","On le remplace par ដែល une seconde fois","On l'antépose"],"reponse":0,"explication":"Stratégie de lacune. Insérer un pronom résomptif (« le livre que je le lis ») est une erreur typique."},{"type":"choix","question":"ថា a un second emploi, lequel ?","options":["C'est aussi le verbe « dire »","C'est aussi un marqueur de futur","C'est aussi une particule de question","C'est aussi un classificateur"],"reponse":0,"explication":"Deux usages pour un seul apprentissage : la conjonction complétive et le verbe « dire »."}]},{"id":"questions","ordre":5,"titre":"Les formes de question","regle":"La question se marque par une particule finale, sans toucher à l'ordre des mots.","mots":[1027,1028,1029,1030],"exercices":[{"type":"choix","question":"Où se placent les mots interrogatifs en khmer ?","options":["À leur place normale dans la phrase, jamais en tête","Toujours en tête de phrase, comme en français","Toujours en fin de phrase","Ils sont facultatifs"],"reponse":0,"explication":"Les mots interrogatifs restent in situ. Les antéposer est un calque du français."},{"type":"choix","question":"À une question en ហើយឬនៅ, que répond-on ?","options":["ហើយ si c'est fait, នៅ ou មិនទាន់ទេ sinon","បាទ ou ចាស uniquement","On répète la question entière","ទេ dans les deux cas"],"reponse":0,"explication":"C'est la question du parfait : elle demande si l'action est accomplie ou pas encore."}]},{"id":"palier-a","ordre":6,"titre":"Palier A · le socle manquant","regle":"Les mots de niveau 1 qui manquaient à l'inventaire.","mots":[27,46,63,65,78,117,119,120,131,132,191,198,276,278,289,297,318,319,329,330,334,348,349,361,363,381,393,394,396,397,399,405,408,410,412,416,422,423,429],"exercices":[{"type":"sens","mot":27,"explication":"Reconnaissance : du khmer vers le sens."},{"type":"production","mot":46,"explication":"Production : du sens vers le khmer."}]},{"id":"palier-b","ordre":7,"titr lle dépendante à part entière, y compris dans l'ordre du dictionnaire.","conditionnelle":false},{"kh":"◌ំ","brut":"ំ","a":"ɑm","o":"um","invariant":false,"note":"Configuration voyelle inhérente + និគ្គហិត (ំ). Traitée comme une voyelle dépendante à part entière. ធំ « grand » se prononce [tʰom] (mais [tʰum] dans certains dialectes).","conditionnelle":false},{"kh":"◌ាំ","brut":"ាំ","a":"am","o":"ŏəm","invariant":false,"note":"Configuration ា + និគ្គហិត. Traitée comme une voyelle dépendante à part entière. Devant ង, devient [aŋ]/[eəŋ].","conditionnelle":false},{"kh":"◌ះ","brut":"ះ","a":"ah","o":"ĕəh","invariant":false,"note":"Configuration voyelle inhérente + រះមុខ (ះ). Traitée comme une voyelle dépendante à part entière.","conditionnelle":false},{"kh":"◌ិះ","brut":"ិះ","a":"eh","o":"ih","invariant":false,"note":"Configuration ិ + រះមុខ ; pas comptée comme voyelle autonome dans l'ordre du dictionnaire.","conditionnelle":false},{"kh":"◌ុះ","brut":"ុះ","a":"oh","o":"uh","invariant":false,"note":"Configuration ុ + រះមុខ.","conditionnelle":false},{"kh":"◌េះ","brut":"េះ","a":"eh","o":"ih","invariant":false,"note":"Configuration េ + រះមុខ.","conditionnelle":false},{"kh":"◌ោះ","brut":"ោះ","a":"ɑh","o":"ŭəh","invariant":false,"note":"Configuration ោ + រះមុខ. នោះ « cela » peut se prononcer [nuh].","conditionnelle":false},{"kh":"◌ើះ","brut":"ើះ","a":"əh","o":"əh","invariant":true,"note":"Configuration rare (variante ឹះ) ; Wikipédia donne [əh] sans distinguer les séries.","conditionnelle":false},{"kh":"◌ែះ","brut":"ែះ","a":"eh","o":"eh","invariant":true,"note":"Configuration rare ; Wikipédia donne [eh] sans distinguer les séries.","conditionnelle":false}],"mecanismes":[{"titre":"Le principe des deux séries","texte":"Chaque consonne porte une voyelle inhérente : ' â ' [ɑː] (1re série, dite série a) ou ' ô ' [ɔː] (2e série, dite série o). Terminologie des sources : Wikipédia dit « a-series / o-series » ; Huffman dit « 1st Series / 2nd Series » ; en khmer les deux séries sont appelées សម្លេងតូច /samlein touc/ « petite voix » et សម្លេងធំ /samlein thom/ « grosse voix », ou សម្លេងស្រាល /samlein sraal/ « voix légère » et សម្លេងធ្ងន់ /samlein tnon/ « voix lourde » (Huffman, note 1 p. 15) ; la grammaire khmère les nomme aussi អឃោសៈ (non voisées, série a) et ឃោសៈ (voisées, série o). Historiquement les deux séries notaient des consonnes sourdes et sonores ; le voisement s'est perdu au moyen khmer mais son effet sur les voyelles suivantes est resté. Conséquence pratique : le système double la fonction des signes vocaliques — un seul jeu de voyelles, deux jeux de consonnes, donc DEUX valeurs pour chaque signe vocalique. La série de la consonne initiale « gouverne » la prononciation de la voyelle."},{"titre":"Règle de gouvernance : comment une consonne souscrite modifie la série de la syllabe","texte":"Formulation de Huffman (Part One, ch. VI « Vowel Governance »). (1) Si la consonne support et la souscrite sont de la même série, aucun problème : la voyelle prend cette série. (2) Si elles sont de séries différentes, deux règles : (2a) DOMINANCE — toute occlusive ou fricative l'emporte sur toute continuante pour déterminer la série de la voyelle suivante, quelle que soit sa position dans le groupe. Groupe I dominant : p, t, c, k, q, b, d, f, s, h. Groupe II passif : m, n, ɲ, ŋ, w, r, l, y. Exemples : ម្ហូប /mhoup/ « nourriture » (ម passif, ហ dominant 1re série → voyelle 1re série) ; ខ្លាន /klien/ « avoir faim » (ខ… dominant 2e série → voyelle 2e série). (2b) Si les DEUX membres du groupe sont dominants, c'est la SOUSCRITE qui détermine la série de la voyelle. Ex. ផ្ទះ /pteah/ « maison », ស្គាល់ /skoal/ « connaître », ខ្ពស់ /kpuh/ « être haut » : support de 1re série, souscrite de 2e série, voyelle de 2e série. Dans ces mots, seules des consonnes de 1re série apparaissent en support, puisque la série de la voyelle est de toute façon donnée par la souscrite. (3) RÈGLE UNIFIÉE de Huffman, valable pour les monosyllabes et la plupart des dissyllabes : « Dans toute syllabe précédée dans le même mot par des consonnes de séries différentes, la série de la voyelle est déterminée par la DERNIÈRE occlusive ou fricative précédente. » Formulation équivalente chez Wikipédia : les occlusives et fricatives dominent les sonantes ; quand les deux membres sont dominants, la souscrite décide ; une consonne non dominante (et dans certains mots ហ hâ) voit aussi sa voyelle inhérente modifiée par une consonne dominante précédente dans le même mot, même s'il y a une voyelle entre elles — avec des exceptions, surtout au-delà de deux syllabes."},{"titre":"Les diacritiques de conversion de série ៉ (មូសិកទន្ត) et ៊ (ត្រីស័ព្ទ)","texte":"Le système est asymétrique : certaines consonnes n'ont pas de contrepartie dans l'autre série. Les diacritiques de conversion comblent ce trou. ៊ ត្រីស័ព្ទ /treisăpt/ (« ligne ondulée », aussi appelée « cheveu de ហ ») convertit les consonnes de 1re série SANS contrepartie de 2e série — ប ស ហ អ — en 2e série : ប៊ /bɔɔ/, ស៊ /sɔɔ/, ហ៊ /hɔɔ/, អ៊ /ʔɔɔ/. La voyelle suivante prend alors sa valeur de 2e série. ៉ មូសិកទន្ត /musĕkâtônd/, aussi nommé ធ្មេញកណ្ដុរ « dents de souris », convertit les consonnes de 2e série sans contrepartie de 1re série — ង ញ ម យ រ វ — en 1re série : ង៉ /ŋɑɑ/, ញ៉ /ɲɑɑ/, ម៉ /mɑɑ/, យ៉ /jɑɑ/, រ៉ /rɑɑ/, វ៉ /ʋɑɑ/. La même ៉ posée sur ប (1re série) ne change pas la série mais la valeur consonantique : ប៉ se lit /p/ au lieu de /ɓ/. La Wikipédia khmère liste donc 7 lettres pour ៉ : ង ញ ប ម យ រ វ → ង៉ ញ៉ ប៉ ម៉ យ៉ រ៉ វ៉. SUBSTITUTION GRAPHIQUE : quand un signe vocalique s'écrit AU-DESSUS de la consonne, il entre en collision avec ៉ ou ៊ ; les deux diacritiques sont alors remplacés par ុ ក្បៀសក្រោម /kbiĕs kraôm/ (aussi appelé បុកជើង /bŏk cheung/, « pied de collision »), un trait vertical écrit SOUS la consonne. Ex. ស៊ + ី → ស៉ី /sii/ « manger » ; ម៉ + ឺ → ម៉ឺន /məɨn/ « 10 000 ». Exception d'usage : le ត្រីស័ព្ទ est souvent maintenu au-dessus sur ហ et អ malgré une voyelle supérieure, les deux formes se rencontrant. À NE PAS CONFONDRE : le ត្រីស័ព្ទ ៊ et le ស័ក /saq/ qui fait partie intégrante de certaines lettres (ឆ ឈ ថ ធ ព ឝ...) (Huffman, note 2 p. 16)."},{"titre":"Structure sesquisyllabique et lecture de la syllabe mineure","texte":"La plupart des mots khmers font une ou deux syllabes. Dans les mots natifs dissyllabiques, la première syllabe est le plus souvent une syllabe MINEURE, entièrement inaccentuée : d'où le terme « sesquisyllabique » (« une syllabe et demie »). L'accent porte sur la syllabe finale. Structure de la syllabe mineure (présyllabe) : CV-, CrV-, CVN- ou CrVN- (C = consonne, V = voyelle, N = nasale). Ses voyelles sont normalement brèves et se réduisent à [ə] en conversation, tout en restant clairement articulées en parole soignée (radio, télévision). Ex. មនុស្ស « personne » [mɔˈnuh], plus relâché [məˈnuh]. Règles de lecture de Huffman (exercices 140-143) : (a) quand la présyllabe est écrite avec un signe vocalique long, la voyelle est en pratique abrégée ; (b) quand la présyllabe est représentée par une SEULE consonne sans voyelle écrite (souvent une réduplication de l'initiale de la syllabe principale), elle se lit avec la voyelle non écrite /ɑ/ après une consonne de 1re série et /o/ après une consonne de 2e série, les deux se réduisant à /ə/ en parole rapide. Ex. កកាយ /kɑkaay/, ជជេក /coceek/, បបួល /bɑbuəl/, មនុស្ស /mɔnuh/, របស់ /rɔbɑh/, ទទួល /tɔtuəl/ ; (c) les présyllabes à deux consonnes se limitent aux groupes /pr-, tr-, cr-, kr-, sr-/ (le plus fréquent étant /pr-/), le -r- s'écrivant en souscrite ្រ ; même règle de voyelle non écrite /ɑ/ ou /o/ selon la série, et s- dans ces présyllabes est toujours de 1re série. ប avec une souscrite vaut toujours /p/. Wikipédia précise en outre qu'en parole soignée, la voyelle inhérente d'une consonne initiale de syllabe faible est abrégée comme si elle portait un bântăk : ច de ចន្លុះ se lit avec /ɑ/, ព de ពន្លឺ avec /ŏə/, les deux se réduisant à /ə/ en parole relâchée. Existent aussi des dissyllabes MAJEURS, à deux syllabes accentuées en jointure serrée (surtout des composés et des emprunts), ex. ភាសា [ˌpʰiəˈsaː] « langue »."},{"titre":"បន្តក់ bântăk ់ — l'abréviateur de voyelle","texte":"Petit trait vertical écrit AU-DESSUS de la DERNIÈRE consonne d'une syllabe. Effets : (1) syllabe à voyelle inhérente â (1re série) : la voyelle s'abrège en [ɑ] (transcription ONU « á ») ; (2) syllabe à voyelle inhérente ô (2e série) : la voyelle devient [u] devant une labiale finale, sinon généralement [ŏə] (transcription ONU « ó ») ; (3) syllabe avec le signe ា en 1re série : la voyelle s'abrège en [a] (« ă ») ; (4) syllabe avec ា en 2e série : la voyelle devient [ŏə] (« oă »), ou [ĕə] (« eă ») devant k, ng, h (ក, គ, ង, ហ). Exemple simple : ចង /cɑːŋ/ → ចង់ /cɑŋ/."},{"titre":"Les autres diacritiques (វណ្ណយុត្តិ vônnâyŭttĕ) et leur effet","texte":"ំ និគ្គហិត nĭkkôhĕt : petit cercle au-dessus ; nasalise la voyelle inhérente ou dépendante avec ajout de [m] ; les voyelles longues sont abrégées. ះ រះមុខ reăhmŭkh « visage brillant » : paire de petits cercles écrite après la consonne ou la voyelle ; modifie la voyelle et ajoute une aspiration finale /h/. ៈ យុគលពិន្ទុ yŭkoălpĭntŭ « paire de points » : diacritique récent, écrit après la consonne ; indique une voyelle brève suivie d'un coup de glotte — vaut [a] en 1re série, [ĕə] en 2e série, suivi du coup de glotte. ៉ មូសិកទន្ត / ធ្មេញកណ្ដុរ et ៊ ត្រីស័ព្ទ : conversion de série (voir mécanisme dédié). ុ ក្បៀសក្រោម / បុកជើង : remplace ៉ et ៊ sous la consonne quand une voyelle supérieure les gênerait. ់ បន្តក់ bântăk : abrègement de voyelle (voir mécanisme dédié). ៌ របាទ rôbat / រេផៈ réphă : diacritique supérieur des emprunts sanskrits, correspondant au repha devanagari ; notait un r ; aujourd'hui la consonne qu'il surmonte et lui-même sont le plus souvent non prononcés. Ex. ធម៌ [tʰɔə] « dharma », កាណ៌ [kaː], សួគ៌ា [suəkiə]. ៍ ទណ្ឌឃាដ tôndôkhéad : écrit sur une consonne finale pour indiquer qu'elle NE SE PRONONCE PAS. ៎ កាកបាទ kakâbat « patte de corbeau » : intonation montante d'exclamation ou d'interjection ; fréquent sur des particules, et sur ចា៎ះ « oui » (registre féminin). ៏ អស្តា âsda « chiffre huit » : dans quelques mots, indique qu'une consonne sans voyelle dépendante doit se prononcer AVEC sa voyelle inhérente au lieu d'être lue comme consonne finale. ័ សំយោគសញ្ញា sâmyoŭk sânhnhéa : dans des emprunts sanskrits/palis, indique que la syllabe contient une voyelle brève particulière ; équivaut à la voyelle ា portant le bântăk, sauf qu'en 2e série sa valeur devient [ɨ] devant un y final et [ɔə] devant un r final (muet). ៑ វិរាម vĭréam : quasi obsolète, correspond au virāma, supprime la voyelle inhérente. PRÉCISION SUR រស្សៈ : ce n'est PAS un diacritique. C'est le terme grammatical d'origine palie désignant les voyelles BRÈVES (រស្សៈ, « short vowels »), par opposition à ទីឃៈ, les voyelles LONGUES. Le terme apparaît dans la description khmère traditionnelle des voyelles, pas dans l'inventaire des signes."},{"titre":"Les consonnes sans voyelle dépendante (comment lire une consonne nue)","texte":"Trois environnements, trois régimes : (1) initiale de syllabe FAIBLE : la voyelle inhérente est abrégée comme si un bântăk était écrit (1re série /ɑ/, 2e série /ŏə/), réduite à /ə/ en parole relâchée ; (2) initiale de syllabe FORTE : la voyelle inhérente est prononcée pleine — ចង [cɑːŋ] « attacher », ជត [cɔːt] « faible » ; mais dans certains mots elle est réduite sans que le bântăk soit écrit (សព [sɑp] « cadavre »), réduction régulière dans les mots finissant par une consonne à souscrite muette (សព្វ [sɑp], សព្ទ [sap]) ; (3) consonne FINALE de mot : elle note un son final, sans voyelle après, et sans détente audible pour les occlusives. Exception dans des emprunts pali/sanskrit où ce qui semble une finale est en fait l'initiale d'une syllabe suivante prononcée avec une voyelle brève comme si ាក់ suivait : សុភ se lit [sopʰĕəʔ]. Irrégularité notable : អ្នក « toi, personne » se prononce [nĕəʔ]."},{"titre":"Contraintes de lecture supplémentaires","texte":"Un mot khmer ne peut pas se terminer par plus d'UN son consonantique : les souscrites finales, présentes pour des raisons étymologiques, ne se prononcent pas (elles peuvent réapparaître si le mot ouvre un composé). Les lettres aspirées (kh-, chh-, th-, ph-) ne sont aspirées que devant voyelle. En finale, les lettres notant [k] (k-, kh-) se prononcent coup de glotte [ʔ] après les voyelles [ɑː aː iə ɨə uə ɑ a ĕə ŭə]. រ final est muet (dans la plupart des dialectes) ; ស final se prononce /h/. ដ et ឌ se prononcent [t] en finale. Dans certains mots, un symbole consonantique médian unique note à la fois la finale d'une syllabe et l'initiale de la suivante. Les groupes de trois consonnes initiales sont rares, et C3 y est toujours /h/ (Huffman)."}],"lacunes":["Omniglot (https://www.omniglot.com/writing/khmer.htm) n'a fourni AUCUNE donnée exploitable : la page décrit le principe des deux séries mais ne donne aucune valeur phonétique par série dans son texte (les tableaux sont des images). Aucune donnée de ce fichier n'en provient.","SEAlang (dictionnaire/corpus khmer) n'a pas été interrogé : aucune requête n'a été lancée sur seasite.niu.edu au-delà d'une page de prononciation citée pour le bântăk. Les valeurs vocaliques n'ont donc pas été recoupées sur une deuxième source indépendante de Huffman.","Wiktionary n'a pas été interrogé.","TOUTES les valeurs IPA des voyelles dépendantes proviennent d'UNE SEULE chaîne de sourçage : le tableau Wikipédia « Khmer script », qui cite Huffman (1970) comme source. Ce n'est donc pas une double vérification. Le dialecte de référence est celui de Battambang / khmer standard ; les dialectes du Nord (diphtongues aplanies) et de l'Ouest (phonation soufflée contrastive) divergent.","Divergence de notation non tranchée sur ា en 2e série : Wikipédia donne [iːə] (d'après Jacob 1968) tandis que ses transcriptions courantes écrivent « éa » et que la plupart des descriptions notent [iə] ; la page précise seulement que អ៊ា est « légèrement distinct » de ៀ. Aucune source consultée ne donne les deux valeurs côte à côte avec une mesure.","Le champ serie_a / serie_o des configurations rares ើះ et ែះ est rempli avec la MÊME valeur dans les deux colonnes parce que Wikipédia ne distingue pas les séries pour ces deux formes — ce n'est pas une affirmation que les deux séries s'y confondent.","La voyelle indépendante obsolète ឨ n'a pas de valeur IPA (aucune source n'en donne) : champ laissé vide.","Les valeurs IPA des voyelles indépendantes ne sont pas dédoublées par série (elles n'en dépendent pas), mais aucune source consultée ne documente leur comportement quand elles portent un diacritique.","L'ordre exact d'introduction des CONSONNES individuelles à l'intérieur des exercices 1 à 51 de Huffman n'a été vérifié directement que jusqu'à l'exercice 8 (groupe vélaire ក ខ គ ឃ ង) dans l'OCR consulté ; la généralisation aux quatre autres groupes articulatoires repose sur la règle d'ordre que Huffman énonce lui-même à l'exercice 8, pas sur la lecture de chaque exercice.","L'ordre exact d'introduction des VOYELLES dans les exercices 64 à 122 de Huffman n'a pas été relevé.","La séquence consonantique du manuel « Basic Khmer » (MSU / LibreTexts) n'a pas pu être vérifiée : la page listant les 16 premières consonnes renvoie HTTP 403.","Aucune source consultée ne fournit de classement des lettres khmères par fréquence d'usage en corpus ; l'existence d'un tel ordre d'enseignement n'a donc pas pu être confirmée ni infirmée.","Les formes souscrites sont données en séquence Unicode (U+17D2 + consonne). Leur rendu graphique réel (position à gauche pour ្រ, éléments ascendants à droite pour certaines, ligatures avec ា) dépend de la police et n'est pas capturé par la chaîne.","Les consonnes supplémentaires pour les emprunts (ហ្គ, ហ្គ៊, ហ្វ, ហ្ស, ហ្ស៊, ប៉) ne sont pas listées dans le champ consonnes : elles sont hors des 33 lettres. Le mécanisme qui les produit est décrit dans les mécanismes."],"sourcage":"Wikipédia « Khmer script », qui cite Huffman 1970. Chaîne de sourçage unique, non recoupée."};

/* ================= état ================= */
const KEY = "khmer-app-v1";
/* vus     : mots déjà découverts (présentés au moins une fois)
   lecons  : blocs dont la leçon a été lue
   neufs   : mots découverts aujourd'hui, borné par NOUVEAUX_PAR_JOUR */
let S = {mots:{}, blocs:{}, vus:{}, lecons:{}, jour:null, faits:0, neufs:0};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const MOTS = new Map(EMBED_MOTS.map(m => [m.id, m]));
const AUJ = () => new Date().toISOString().slice(0,10);
const PALIERS = [1,3,7,16,35,60];
/* 4 mots neufs par jour : le budget déclaré est de 5 à 8 minutes.
   Au-delà, la découverte mange toute la session et rien ne se consolide. */
const NOUVEAUX_PAR_JOUR = 4;

/* réinitialise les compteurs du jour */
if(S.jour !== AUJ()){ S.jour = AUJ(); S.faits = 0; S.neufs = 0; save(); }

function etat(id){ return S.mots[id] || (S.mots[id] = {n:0, gap:0, du:AUJ(), best:0}); }
function du(id){ return etat(id).du <= AUJ(); }

function repond(id, juste){
  const e = etat(id);
  if(juste){
    e.n = Math.min(e.n+1, PALIERS.length-1);
    e.gap = PALIERS[e.n];
    e.best = Math.max(e.best, e.gap);
  }else{
    e.n = 0; e.gap = 1;
  }
  const d = new Date(); d.setDate(d.getDate()+e.gap);
  e.du = d.toISOString().slice(0,10);
  S.faits++;
  save();
}

/* ================= navigation ================= */

  PAGES.forEach(x => {
    document.getElementById("p-"+x).classList.toggle("hidden", x!==p);
    document.getElementById("t-"+x).setAttribute("aria-selected", String(x===p));
  });

}

/* ================= file de session ================= */
function blocActif(){
  for(const b of EMBED_BLOCS){
    const st = S.blocs[b.id] || {};
    if(!st.fini) return b;
  }
  return null;
}

/* La session se compose dans cet ordre, et l'ordre est le point important :
   on n'interroge jamais sur ce qui n'a pas d'abord été montré.
     1. la leçon du bloc, si elle n'a pas été lue
     2. les mots neufs, présentés sans notation, dans la limite du quota
     3. les révisions dues
     4. les exercices du bloc, seulement une fois la leçon lue          */
function file(){
  const b = blocActif();
  if(!b) return [];

  if(!S.lecons[b.id]) return [{k:"lecon", bloc:b}];

  const neufs = [], revisions = [], exos = [];

  for(const mid of (b.mots||[])){
    const m = MOTS.get(mid);
    if(!m) continue;
    if(!S.vus[mid]){
      if(neufs.length + S.neufs < NOUVEAUX_PAR_JOUR) neufs.push({k:"neuf", mot:m, bloc:b});
    }else if(du(mid)){
      revisions.push({k:"mot", mot:m, bloc:b});
    }
  }

  (b.exercices||[]).forEach((e,i) => {
    const key = b.id+":ex"+i;
    if(du(key)) exos.push({k:"ex", ex:e, id:key, bloc:b});
  });

  // les mots des blocs déjà finis qui redeviennent dus
  for(const bb of EMBED_BLOCS){
    if(bb.id === b.id) continue;
    if(!(S.blocs[bb.id]||{}).fini) continue;
    for(const mid of (bb.mots||[])){
      if(S.vus[mid] && du(mid) && MOTS.has(mid))
        revisions.push({k:"mot", mot:MOTS.get(mid), bloc:bb});
    }
  }

  return [...neufs, ...revisions, ...exos];
}

/* nombre de mots du bloc en cours pas encore découverts */
function resteADecouvrir(b){
  return (b.mots||[]).filter(id => !S.vus[id]).length;
}

function decouvert(id){
  S.vus[id] = AUJ();
  S.neufs++;
  const e = etat(id);
  e.n = 0; e.gap = 1;
  const d = new Date(); d.setDate(d.getDate()+1);
  e.du = d.toISOString().slice(0,10);
  save();
}

/* ================= vue Réviser ================= */
let courant = null, revele = false;

function vueRev(){
  const el = document.getElementById("p-rev");
  const b = blocActif();

  if(!b){
    el.innerHTML = `<h2>Tous les blocs sont faits</h2>
      <p class="muted">Il n'y a plus de nouveau bloc à ouvrir. Les révisions
      continuent au fil des échéances.</p>`;
    return;
  }

  const f = file();
  if(!f.length){
    const reste = resteADecouvrir(b);
    el.innerHTML = `<h2>C'est fait pour aujourd'hui</h2>
      <p class="muted">${S.faits} carte${S.faits>1?"s":""} révisée${S.faits>1?"s":""},
      ${S.neufs} mot${S.neufs>1?"s":""} découvert${S.neufs>1?"s":""}.</p>
      ${reste ? `<div class="call"><strong>${reste} mot${reste>1?"s":""} encore à découvrir</strong>
        dans ce bloc. Le quota est de ${NOUVEAUX_PAR_JOUR} par jour, pour que la découverte
        ne mange pas toute la session. Ils viendront demain.</div>` : ``}
      <div class="card">
        <div class="pill">bloc en cours</div>
        <h3 style="margin-top:.5rem">${esc(b.titre)}</h3>
        <p class="regle">${esc(b.regle)}</p>
        ${reste ? `` : `<div class="row">
          <button class="act" onclick="finirBloc('${b.id}')">J'ai fini ce bloc</button>
        </div>`}
      </div>
      <div class="row">
        <button class="act" onclick="relireLecon('${b.id}')">Relire la leçon</button>
      </div>`;
    return;
  }

  // une leçon ou un mot neuf passe toujours en premier : on ne teste
  // jamais avant d'avoir montré. Les révisions se tirent au sort.
  if(f[0].k === "lecon" || f[0].k === "neuf") courant = f[0];
  else courant = f[Math.floor(Math.random()*Math.min(f.length,5))];

  revele = false;
  rendCarte(el, f.length, b);
}

function relireLecon(id){ S.lecons[id] = false; save(); vueRev(); }

function rendCarte(el, reste, b){
  const c = courant;
  const entete = `
    <div class="stats">
      <div><b>${reste}</b><span>en file</span></div>
      <div><b>${S.neufs}/${NOUVEAUX_PAR_JOUR}</b><span>mots neufs</span></div>
      <div><b>${S.faits}</b><span>révisions</span></div>
    </div>
    <div class="pill">${esc(b.titre)}</div>`;

  /* --- la leçon du bloc : rien n'est demandé, tout est montré --- */
  if(c.k === "lecon"){
    const mots = (b.mots||[]).map(id=>MOTS.get(id)).filter(Boolean);
    el.innerHTML = `
      <div class="pill">bloc ${b.ordre} · la leçon</div>
      <h2>${esc(b.titre)}</h2>
      <div class="card">
        <p class="regle">${esc(b.regle)}</p>
        ${b.gabarit?`<div class="gabarit">${b.gabarit}</div>`:``}
        <h3>Les ${mots.length} mots du bloc</h3>
        ${mots.map(m=>`<div class="entry">
          <span class="kh">${esc(m.kh)}</span>
          <span>${phon(m)||"—"}</span>
          <span class="fr">${esc(m.fr)}</span>
          ${statutPill(m)}
        </div>`).join("")}
        <div class="row">
          <button class="act pri" onclick="lu('${b.id}')">J'ai lu, on commence</button>
        </div>
      </div>
      <p class="muted">Les mots seront introduits ${NOUVEAUX_PAR_JOUR} par jour, puis révisés
      à intervalles croissants. Tu peux revenir à cette leçon quand tu veux.</p>`;
    return;
  }

  /* --- découverte d'un mot neuf : présenté, pas interrogé --- */
  if(c.k === "neuf"){
    const m = c.mot;
    el.innerHTML = entete + `
      <div class="card q">
        <div class="pill val" style="margin-bottom:.8rem">nouveau mot</div>
        <div class="prompt-kh kh">${esc(m.kh)}</div>
        ${phon(m)}
        <div class="answer">
          <div class="fr">${esc(m.fr)}</div>
          ${statutPill(m)} ${ecoute(m)}
          ${m.note?`<div class="note">${esc(m.note)}</div>`:``}
        </div>
        <div class="row" style="justify-content:center">
          <button class="act pri" onclick="vuNeuf(${m.id})">Compris, au suivant</button>
        </div>
      </div>
      <p class="muted">Il reviendra demain, puis de plus en plus espacé.</p>`;
    return;
  }

  if(c.k === "mot"){
    const m = c.mot;
    const prod = Math.random() < .5;   // moitié reconnaissance, moitié production
    c.prod = prod;
    el.innerHTML = entete + `
      <div class="card q">
        ${prod
          ? `<div class="prompt-fr">${esc(m.fr)}</div>`
          : `<div class="prompt-kh kh">${esc(m.kh)}</div>
             ${phon(m)}`}
        <div id="ans" class="answer hidden">
          ${prod
            ? `<div class="prompt-kh kh">${esc(m.kh)}</div>
               ${phon(m)}`
            : `<div class="fr">${esc(m.fr)}</div>`}
          ${statutPill(m)} ${ecoute(m)}
          ${m.note?`<div class="note">${esc(m.note)}</div>`:``}
        </div>
        <div class="row" id="ctl" style="justify-content:center">
          <button class="act pri" onclick="reveler()">Voir la réponse</button>
        </div>
      </div>`;
  }else{
    const e = c.ex;
    el.innerHTML = entete + `
      <div class="card">
        <p style="font-size:1.15rem">${esc(e.question)}</p>
        ${e.gabarit?`<div class="gabarit">${e.gabarit.replace("___","<b>___</b>")}</div>`:``}
        <div class="opts" id="opts">
          ${e.options.map((o,i)=>`<button onclick="choisir(${i})">${o}</button>`).join("")}
        </div>
        <div id="ans" class="hidden">
          <div class="call"><strong>Pourquoi.</strong> ${esc(e.explication)}</div>
          <div class="row"><button class="act pri" onclick="vueRev()">Suivant</button></div>
        </div>
      </div>`;
  }
}

function reveler(){
  revele = true;
  document.getElementById("ans").classList.remove("hidden");
  document.getElementById("ctl").innerHTML =
    `<button class="act" onclick="noter(false)">À revoir</button>
     <button class="act pri" onclick="noter(true)">Je savais</button>`;
}

function noter(juste){
  repond(courant.mot.id, juste);
  vueRev();
}

function choisir(i){
  const e = courant.ex;
  const btns = [...document.querySelectorAll("#opts button")];
  btns.forEach((b,j)=>{
    b.disabled = true;
    if(j === e.reponse) b.classList.add("good");
    else if(j === i) b.classList.add("bad");
  });
  repond(courant.id, i === e.reponse);
  document.getElementById("ans").classList.remove("hidden");
}

function lu(id){ S.lecons[id] = AUJ(); save(); vueRev(); }
function vuNeuf(id){ decouvert(id); vueRev(); }

function finirBloc(id){
  S.blocs[id] = Object.assign(S.blocs[id]||{}, {fini:true, le:AUJ()});
  save(); vueRev();
}

/* ================= vue Blocs ================= */
function vueBloc(){
  const el = document.getElementById("p-bloc");
  const actif = blocActif();
  el.innerHTML = `<h2>La séquence</h2>
    <p class="muted">Un bloc à la fois, dans l'ordre. Le suivant s'ouvre quand
    le précédent est marqué fini.</p>` +
    EMBED_BLOCS.map(b => {
      const st = S.blocs[b.id]||{};
      const en = actif && actif.id===b.id;
      const mots = (b.mots||[]).map(id=>MOTS.get(id)).filter(Boolean);
      return `<div class="bloc">
        <div class="bloc-h">
          <span class="n">BLOC ${b.ordre}</span>
          <h3>${esc(b.titre)}</h3>
          <span class="pill ${st.fini?"ok":en?"val":""}">${st.fini?"fini":en?"en cours":"à venir"}</span>
        </div>
        <div class="bloc-b">
          <p class="regle">${esc(b.regle)}</p>
          ${b.gabarit?`<div class="gabarit">${b.gabarit}</div>`:``}
          ${mots.length?`<h3>Les mots</h3>`+mots.map(m=>`
            <div class="entry">
              <span class="kh">${esc(m.kh)}</span>
              <span>${phon(m)||"—"}</span>
              <span class="fr">${esc(m.fr)}</span>
              ${statutPill(m)}
            </div>`).join(""):``}
        </div>
      </div>`;
    }).join("");
}


/* ================= vue Écriture =================
   Le blocage identifié : une même voyelle se lit différemment selon la
   série de la consonne qui la porte. C'est un système fini, donc
   entraînable. L'entraînement fabrique les syllabes à la volée en
   combinant une consonne et une voyelle de la table : la réponse est
   déduite des données sourcées, jamais écrite à la main.               */
let ecrOnglet = "principe";

function vueEcr(){
  const A = EMBED_ALPHA;
  if(!A.consonnes){
    document.getElementById("p-ecr").innerHTML =
      `<h2>Écriture</h2><p class="muted">Table non chargée.</p>`;
    return;
  }
  const sous = [
    ["principe","Le principe"],
    ["drill","S'entraîner"],
    ["cons","Les consonnes"],
    ["voy","Les voyelles"],
  ];
  document.getElementById("p-ecr").innerHTML = `
    <h2>L'écriture</h2>
    <div class="row" style="margin:.4rem 0 1rem">
      ${sous.map(([k,l])=>`<button class="act${ecrOnglet===k?" pri":""}"
        onclick="ecrGo('${k}')">${l}</button>`).join("")}
    </div>
    <div id="ecr-corps"></div>`;
  ({principe:ecrPrincipe, drill:ecrDrill, cons:ecrCons, voy:ecrVoy})[ecrOnglet]();
}
function ecrGo(k){ ecrOnglet = k; vueEcr(); }

function ecrPrincipe(){
  const A = EMBED_ALPHA;
  const na = A.consonnes.filter(c=>c.serie==="a").length;
  const no = A.consonnes.length - na;
  const inv = A.voyelles.filter(v=>v.invariant);
  document.getElementById("ecr-corps").innerHTML = `
  <div class="call warn">
    <p><strong>Connaître les lettres ne suffit pas à lire le khmer.</strong>
    Chaque consonne appartient à l'une de <b>deux séries</b>, et une même voyelle
    se prononce différemment selon la série de la consonne qui la porte.
    C'est ce mécanisme, pas la mémorisation des signes, qui bloque la lecture.</p>
  </div>
  <div class="stats">
    <div><b>${na}</b><span>consonnes série a</span></div>
    <div><b>${no}</b><span>consonnes série o</span></div>
    <div><b>${A.voyelles.length}</b><span>voyelles</span></div>
  </div>
  <h3>Par où commencer</h3>
  <p>${inv.length} voyelles se lisent <strong>pareil dans les deux séries</strong>.
  Elles ne demandent aucun arbitrage, c'est le point d'entrée le moins coûteux :</p>
  <div class="gabarit">${inv.map(v=>`${v.kh} <span class="ipa">${v.a}</span>`).join(" &nbsp;·&nbsp; ")}</div>
  <p class="muted">Toutes les autres imposent de savoir d'abord à quelle série
  appartient la consonne. C'est ce que l'entraînement fait travailler.</p>
  ${A.voyelles.filter(v=>v.conditionnelle).length ? `<div class="call">
    <p><strong>Un cas mis de côté.</strong>
    ${A.voyelles.filter(v=>v.conditionnelle).map(v=>v.kh).join(", ")} se lit différemment
    selon qu'une consonne finale est écrite ou non. Cette voyelle est retirée de
    l'entraînement tant que cette règle n'est pas abordée, mais elle reste dans
    le tableau.</p></div>` : ``}
  <h3>Les mécanismes</h3>
  ${A.mecanismes.map(m=>`<div class="card">
    <h3 style="margin-top:0">${esc(m.titre)}</h3>
    <p class="muted" style="margin:0">${esc(m.texte)}</p></div>`).join("")}
  <div class="call">
    <p><strong>Sourçage.</strong> ${esc(A.sourcage)}
    ${A.lacunes && A.lacunes.length ? `<br>${A.lacunes.length} lacunes sont déclarées
    dans les données, dont l'absence de recoupement par SEAlang et Wiktionary.` : ``}</p>
  </div>`;
}

function ecrCons(){
  const A = EMBED_ALPHA;
  document.getElementById("ecr-corps").innerHTML = `
    <p class="muted">La série se lit dans la colonne de droite. C'est elle qui
    commande la lecture de la voyelle qui suivra.</p>
    <div class="tw"><table>
      <thead><tr><th>Lettre</th><th>Valeur</th><th>Souscrite</th><th>Série</th></tr></thead>
      <tbody>${A.consonnes.map(c=>`<tr>
        <td class="k kh" style="font-size:1.7rem">${esc(c.kh)}</td>
        <td class="ipa">${esc(c.ipa)}</td>
        <td class="kh" style="font-size:1.5rem">${c.sous?esc(c.sous):`<span class="muted">—</span>`}</td>
        <td><span class="pill ${c.serie==="a"?"ok":"val"}">série ${esc(c.serie)}</span></td>
      </tr>`).join("")}</tbody>
    </table></div>
    <p class="muted">ឡ est la seule consonne sans forme souscrite.</p>`;
}

function ecrVoy(){
  const A = EMBED_ALPHA;
  document.getElementById("ecr-corps").innerHTML = `
    <p class="muted">Les deux colonnes du milieu sont le cœur du problème :
    même signe, deux lectures. Les lignes marquées <span class="pill ok">invariante</span>
    se lisent pareil des deux côtés.</p>
    <div class="tw"><table>
      <thead><tr><th>Signe</th><th>Avec série a</th><th>Avec série o</th><th></th></tr></thead>
      <tbody>${A.voyelles.map(v=>`<tr>
        <td class="k kh" style="font-size:1.7rem">${esc(v.kh)}</td>
        <td class="ipa">${esc(v.a)}</td>
        <td class="ipa">${esc(v.o)}</td>
        <td>${v.invariant?`<span class="pill ok">invariante</span>`:``}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
}

/* --- entraînement : lire une syllabe consonne + voyelle --- */
let syl = null;
function ecrDrill(){
  const A = EMBED_ALPHA;
  const c = A.consonnes[Math.floor(Math.random()*A.consonnes.length)];
  // Une voyelle dont la lecture dépend d'une condition (présence d'une
  // finale écrite) est écartée : le drill fabrique des syllabes nues, la
  // règle n'est pas encore enseignée, et afficher « ɨ, i » comme réponse
  // n'apprendrait rien.
  const cand = A.voyelles.filter(v=>!v.invariant && !v.conditionnelle);
  const v = cand[Math.floor(Math.random()*cand.length)];
  const bonne = c.serie === "a" ? v.a : v.o;
  const autre = c.serie === "a" ? v.o : v.a;

  // leurres : la lecture de l'autre série, plus deux lectures d'autres voyelles
  const leurres = new Set([autre]);
  while(leurres.size < 3){
    const x = cand[Math.floor(Math.random()*cand.length)];
    const y = Math.random()<.5 ? x.a : x.o;
    if(y !== bonne) leurres.add(y);
  }
  const opts = [bonne, ...leurres].filter((x,i,t)=>t.indexOf(x)===i);
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}

  syl = {c, v, bonne, autre, opts};
  document.getElementById("ecr-corps").innerHTML = `
    <p class="muted">Comment se lit cette syllabe ?</p>
    <div class="card q">
      <div class="prompt-kh kh">${esc(c.kh)}${esc(v.brut||"")}</div>
      <div class="opts" id="sopts">
        ${opts.map((o,i)=>`<button onclick="sylRep(${i})"><span class="ipa">${esc(c.ipa)}${esc(o)}</span></button>`).join("")}
      </div>
      <div id="sans" class="hidden" style="margin-top:1rem;text-align:left">
        <div class="call"><strong>${esc(c.kh)} est de série ${esc(c.serie)}</strong>,
        donc ${esc(v.kh)} s'y lit <b>${esc(syl.bonne)}</b>.
        Avec une consonne de l'autre série, le même signe se lirait
        <b>${esc(syl.autre)}</b>.</div>
        <div class="row"><button class="act pri" onclick="ecrDrill()">Syllabe suivante</button></div>
      </div>
    </div>
    <p class="muted">Syllabes fabriquées à la volée depuis la table. La lecture
    donnée est celle de la règle de série ; les mots réels comportent des
    exceptions, que seul l'usage apprend.</p>`;
}

function sylRep(i){
  const btns = [...document.querySelectorAll("#sopts button")];
  btns.forEach((b,j)=>{
    b.disabled = true;
    const val = syl.c.ipa + syl.opts[j];
    if(syl.opts[j] === syl.bonne) b.classList.add("good");
    else if(j === i) b.classList.add("bad");
  });
  document.getElementById("sans").classList.remove("hidden");
}

/* ================= vue Dico ================= */
function vueDico(){
  const el = document.getElementById("p-dico");
  el.innerHTML = `<h2>Dictionnaire</h2>
    <input type="search" id="q" placeholder="Chercher en français, en khmer ou en romanisation"
           oninput="filtre()" autocomplete="off">
    <div id="res"></div>`;
  filtre();
}

function filtre(){
  const q = (document.getElementById("q").value||"").toLowerCase().trim();
  const list = EMBED_MOTS.filter(m => !q ||
    m.fr.toLowerCase().includes(q) || m.kh.includes(q) ||
    (m.rom||"").toLowerCase().includes(q));
  document.getElementById("res").innerHTML =
    `<p class="muted">${list.length} mot${list.length>1?"s":""}</p>` +
    list.map(m=>`<div class="entry">
      <span class="kh">${esc(m.kh)}</span>
      <span>${phon(m)||"—"}</span>
      <span class="fr">${esc(m.fr)}</span>
      ${statutPill(m)} ${ecoute(m)}
    </div>`).join("");
}

/* ================= vue À valider ================= */
function vueVal(){
  const el = document.getElementById("p-val");
  const list = EMBED_MOTS.filter(m => m.statut !== "verifie");
  el.innerHTML = `<h2>À faire valider</h2>
    <div class="call warn">
      <p><strong>Pourquoi cette liste existe.</strong> Ces entrées n'ont pas pu être
      confirmées dans un dictionnaire de référence. Leur graphie ou leur sens vient
      d'une source faible, ou le mot n'existe pas comme unité dans les dictionnaires
      consultés. Fais-les vérifier par un locuteur natif avant de les apprendre.</p>
    </div>
    <p class="muted">${list.length} entrée${list.length>1?"s":""} en attente.</p>` +
    list.map(m=>`<div class="card">
      <div class="entry" style="border:none;padding:0">
        <span class="kh" style="font-size:2rem">${esc(m.kh)}</span>
        <span>${phon(m)||"—"}</span>
        <span class="fr">${esc(m.fr)}</span>
        ${statutPill(m)}
      </div>
      ${m.note?`<p class="muted" style="margin:.6rem 0 0">${esc(m.note)}</p>`:``}
    </div>`).join("");
}

/* ================= utilitaires ================= */
/* rom = translittération lettre à lettre ; ipa = prononciation réelle.
   Les deux se ressemblent en khmer, mais l'API porte la longueur,
   l'aspiration et les implosives, que la romanisation efface. */
function phon(m){
  const r = m.rom ? `<span class="rom">${esc(m.rom)}</span>` : "";
  const i = m.ipa ? `<span class="ipa">/${esc(m.ipa)}/</span>` : "";
  return r && i ? r + " &nbsp;" + i : (r || i);
}
/* Écoute : lien vers la page kheng.info du mot. On ne copie aucun fichier,
   leurs enregistrements n'ont aucune licence explicite, donc tous droits
   réservés, et la voix est celle d'une locutrice identifiée. */
function ecoute(m){
  return `<a class="audio" target="_blank" rel="noopener noreferrer"
     href="https://kheng.info/search/?query=${encodeURIComponent(m.kh)}"
     title="Écouter ${esc(m.kh)} sur kheng.info">▶ écouter</a>`;
}
function statutPill(m){
  if(m.statut === "verifie")   return `<span class="pill ok">vérifié</span>`;
  if(m.statut === "a_valider") return `<span class="pill val">à valider</span>`;
  return `<span class="pill no">non vérifié</span>`;
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

go("rev");
